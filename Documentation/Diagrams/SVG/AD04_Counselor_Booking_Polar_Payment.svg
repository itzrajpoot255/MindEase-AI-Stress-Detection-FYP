<text x="475.0" y="735" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 5.6.4: Activity Diagram for Counselor Booking &amp; Polar Payment Verification</text>
