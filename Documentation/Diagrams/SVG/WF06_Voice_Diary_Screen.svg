<rect x="150" y="705" width="120" height="4" rx="2" fill="#94a3b8"/>
<!-- Figure Title Below -->
<text x="210.0" y="765" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 3.3.6: Voice Diary & Whisper Transcription Screen</text>
